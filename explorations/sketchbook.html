<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Jnce — Sketchbook</title>

  <link rel="shortcut icon" type="image/x-icon" href="../assets/favicon.ico" />

  <!-- Phosphor Icons -->
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>

  <style>
    @font-face {
      font-family: labelfont;
      src: url(https://files.jcink.net/uploads2/jossisbasic/ShineTypewriter_lgwzd.ttf);
      font-weight: 400;
    }

    :root {
      --text-color: rgba(33, 33, 33, .85);
    }


    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color: #ffffff;
      background-image: url("../assets/rice-paper-3.png");
      color: #040f4e;
      overflow: hidden;
    }

    /* Hide Scrollbar */

    ::-webkit-scrollbar {
      width: 1px;
      height: 1px;
    }

    ::-webkit-scrollbar-button {
      width: 1px;
      height: 1px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .external {
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    .horizontal-scroll-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;

      width: 100vh;
      height: 100vw;

      overflow-y: auto;
      overflow-x: hidden;

      transform: rotate(-90deg) translate3d(0, -100vh, 0);
      transform-origin: right top;

      perspective: 1px;
      transform-style: preserve-3d;

      padding: 0;
      padding-bottom: 10rem;
    }

    .img-wrapper {
      transform: rotate(90deg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      transform-origin: 50% 50%;
      transition: 1s ease;
    }

    .img-wrapper:hover {
      min-height: 62vh;
    }

    .img-wrapper a {
      overflow: hidden;
      display: block;
      padding: 10px;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 5px;
      box-shadow: 0 18px 45px rgba(4, 15, 78, 0.12);
    }

    .img-wrapper img {
      max-width: 45vh;
      max-height: 50vh;
      border-radius: 5px;
      transition: 0.5s ease;
      vertical-align: top;
      filter: grayscale(8%) saturate(85%);
    }

    .img-wrapper a:hover img {
      filter: none;
      transform: scale(1.03);
    }

    /* parallax positions */

    .normal {
      transform: rotate(90deg) translateZ(.1px) scale(0.9) translateX(0) translateY(-3vh);
    }

    .slower {
      transform: rotate(90deg) translateZ(-.2px) scale(1.1) translateX(0%) translateY(-10vh);
    }

    .slower1 {
      transform: rotate(90deg) translateZ(-.25px) scale(1.05) translateX(0%) translateY(8vh);
    }

    .slower2 {
      transform: rotate(90deg) translateZ(-.3px) scale(1.3) translateX(0%) translateY(2vh);
    }

    .slower-down {
      transform: rotate(90deg) translateZ(-.2px) scale(1.1) translateX(0%) translateY(16vh);
    }

    .faster {
      transform: rotate(90deg) translateZ(.15px) scale(0.8) translateX(0%) translateY(14vh);
    }

    .faster1 {
      transform: rotate(90deg) translateZ(.05px) scale(0.8) translateX(0%) translateY(10vh);
    }

    .fastest {
      transform: rotate(90deg) translateZ(.22px) scale(0.7) translateX(-10vh) translateY(-15vh);
    }

    .vertical {
      transform: rotate(90deg) translateZ(-.15px) scale(1.15) translateX(0%) translateY(0%);
    }

    .last {
      transform: rotate(90deg) translateZ(-.2px) scale(1.1) translateX(25vh) translateY(-8vh);
    }

    /* scroll note */

    .scroll-info {
      position: absolute;
      top: 2rem;
      left: 2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: labelfont;
      color: var(--text-color);
      font-size: 16px;
      letter-spacing: 0.04em;
      z-index: 10;
    }

    .scroll-info i {
      font-size: 18px;
      font-weight: 600;
    }


    .gallery-header {
      position: absolute;
      left: 2rem;
      bottom: 2rem;
      max-width: 390px;
      z-index: 10;
    }

    .gallery-header h1 {
      font-family: labelfont;
      font-size: clamp(32px, 4vw, 40px);
      line-height: 1;
      font-weight: 100;
      color: var(--text-color);
      margin: 0 0 14px;
    }

    .gallery-header p {
      color: var(--text-color);
      font-family: labelfont;
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }

    .back-btn {
      position: absolute;
      right: 2rem;
      top: 2.4rem;
      z-index: 20;
    }

    .back-btn i {
      font-size: 16px;
      font-weight: 600;
    }

    .back-btn a {
      font-family: labelfont;
      color: var(--text-color);
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(34px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .gallery-header {
        left: 1.2rem;
        bottom: 1.4rem;
        max-width: 300px;
      }

      .gallery-header h1 {
        font-size: 32px;
      }

      .gallery-header p {
        font-size: 13px;
      }

      .scroll-info {
        top: 1.2rem;
        left: 1.2rem;
      }

      .back-btn {
        right: 1.2rem;
        top: 2.02rem;
      }

      .img-wrapper img {
        max-width: 38vh;
        max-height: 45vh;
      }
    }
  </style>
</head>

<body>

  <!-- Content Begins Here -->

  <div class="external">

    <div class="back-btn reveal">
      <a href="../index.html">
        back <i class="ph ph-arrow-u-up-left"></i>
      </a>
    </div>

    <p class="scroll-info reveal">
      <i class="ph ph-arrow-down"></i>
      scroll
    </p>

    <header class="gallery-header reveal">
      <h1>Sketchbook</h1>
      <p>
        Just some sketches and doodles pulled straight from my sketchbook — drawn in moments when I simply felt like it.
      </p>
    </header>

    <div class="horizontal-scroll-wrapper">

      <div class="img-wrapper slower">
        <a href="#" onclick="return false;">
          <img src="../assets/art-01.jpg" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper faster">
        <a href="#" onclick="return false;">
          <img src="../assets/art-02.jpg" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper slower vertical">
        <a href="#" onclick="return false;">
          <img src="../assets/art-03.jpg" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper slower slower-down">
        <a href="#" onclick="return false;">
          <img src="../assets/art-04.jpg" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper normal">
        <a href="#" onclick="return false;">
          <img src="../assets/art-05.JPG" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper slower">
        <a href="#" onclick="return false;">
          <img src="../assets/art-06.jpg" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper faster1">
        <a href="#" onclick="return false;">
          <img src="../assets/art-07.JPG" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper slower slower2">
        <a href="#" onclick="return false;">
          <img src="../assets/art-08.jpg" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper normal">
        <a href="#" onclick="return false;">
          <img src="../assets/art-09.JPG" alt="Personal artwork by Janice">
        </a>
      </div>

      <div class="img-wrapper slower last">
        <a href="#" onclick="return false;">
          <img src="../assets/art-10.jpg" alt="Personal artwork by Janice">
        </a>
      </div>

    </div>
  </div>


  <!-- Content Ends Here -->

  <script>
    // Reveal Effect
    const revealItems = document.querySelectorAll(".reveal");

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("show");
        }
      });
    }, { threshold: 0.15 });

    revealItems.forEach((item) => revealObserver.observe(item));
  </script>

</body>

</html>
